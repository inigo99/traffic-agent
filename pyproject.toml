[project]
name = "trafico-agent"
version = "0.1.0"
description = "Asistente de normativa de tráfico (DGT/BOE) con citas"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.15",
    "mcp>=2.3.0",
    "ollama>=0.6.3",
    "pdfplumber>=0.11",
    "pydantic>=2.14.1",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=3.1.1",
]

[project.scripts]
trafico-mcp = "trafico_agent.mcp_server:main"

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3",
]
obs = [
    "arize-phoenix>=20.23.0",
    "arize-phoenix-otel>=0.17.2",
    "openinference-instrumentation-langchain>=0.1.79",
]
demo = [
    "fastapi>=0.156.8",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.156.8",
    "pytest>=8",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

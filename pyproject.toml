[project]
name = "trafico-agent"
version = "0.1.0"
description = "Asistente de normativa de tráfico (DGT/BOE) con citas"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.15",
    "ollama>=0.6.3",
    "pdfplumber>=0.11",
    "pydantic>=2.14.1",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=3.1.1",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

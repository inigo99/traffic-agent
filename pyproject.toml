[project]
name = "trafico-agent"
version = "0.1.0"
description = "Asistente de normativa de tráfico (DGT/BOE) con citas"
requires-python = ">=3.12"
dependencies = ["pdfplumber>=0.11"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

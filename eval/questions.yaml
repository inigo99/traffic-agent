# Conjunto de evaluación de trafico-agent. Es el contrato: cualquier cambio de prompt o modelo
# se evalúa contra este fichero antes del merge.
#
# Campos (validados en tests/test_questions.py):
#   id             F.. factual | S.. situación "¿es multa?" | T.. trampa
#   tipo           factual | situacion | trampa
#   pregunta       texto tal cual lo escribiría un usuario
#   comportamiento responder | aclarar | rechazar | corregir | avisar
#   citas          artículos que la respuesta debe citar (gold de recuperación). Cada elemento es
#                  una cita {norma, id_bloque, apartado} o una lista de citas equivalentes (basta una:
#                  p. ej. el artículo del RGC o su precepto equivalente en la LSV)
#   claves         textos que deben aparecer en la respuesta (comprobación automática barata)
#   sancion        situaciones con comportamiento=responder o avisar: {codigo, gravedad, importe_eur,
#                  pronto_pago_eur, puntos}. Sale de la tabla ARCI (o del Anexo IV para velocidad;
#                  codigo null si el tramo lo decide el Anexo IV)
#   falta          solo comportamiento=aclarar: datos que el agente debe pedir
#   motivo         trampas: ordenanza | penal | premisa_falsa | competencia | fuera_ambito;
#                  situaciones con comportamiento=avisar: arci_desfasada (la ARCI cita un apartado que
#                  ya no existe en el texto vigente: se da la sanción y se avisa)
#   revisar        true si el gold necesita confirmación humana antes de usarlo como métrica
#
# Corpus: BOE consolidado a 26-06-2026 (con artículos del RGC vigentes desde 01-10-2026) y ARCI de 12-11-2025.

